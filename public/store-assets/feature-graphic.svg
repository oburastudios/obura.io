<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#101230"/>
      <stop offset="0.6" stop-color="#1a1c48"/>
      <stop offset="1" stop-color="#242465"/>
    </linearGradient>
    <radialGradient id="glowR" cx="0.82" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#5555dc" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#5555dc" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#5555dc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL" cx="0.12" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#8995fe" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8995fe" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a68ea"/>
      <stop offset="1" stop-color="#4442bc"/>
    </linearGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Zemin -->
  <rect width="1024" height="500" fill="url(#bg)"/>
  <rect width="1024" height="500" fill="url(#dots)"/>
  <rect width="1024" height="500" fill="url(#glowR)"/>
  <rect width="1024" height="500" fill="url(#glowL)"/>

  <!-- Sol: logo çipi + isim + slogan -->
  <g>
    <rect x="72" y="132" width="88" height="88" rx="22" fill="url(#chip)"/>
    <g transform="translate(88 148) scale(2.333)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 22v-8"/>
      <path d="M2.336 8.89 10 14l11.715-7.029"/>
      <path d="M22 14a2 2 0 0 1-.971 1.715l-10 6a2 2 0 0 1-2.138-.05l-6-4A2 2 0 0 1 2 16v-6a2 2 0 0 1 .971-1.715l10-6a2 2 0 0 1 2.138.05l6 4A2 2 0 0 1 22 8z"/>
    </g>

    <text x="180" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="700" fill="#ffffff" letter-spacing="-1">CostMate</text>

    <text x="74" y="286" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#e4e7ff">Know what your products</text>
    <text x="74" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#e4e7ff">really cost.</text>

    <text x="74" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#9aa3d8">Materials · Equipment · Overhead · Real margins</text>
  </g>

  <!-- Sağ: üretim zinciri motifi -->
  <g>
    <!-- son düğümün arkasına parıltı -->
    <circle cx="906" cy="250" r="64" fill="#5555dc" opacity="0.55" filter="url(#soft)"/>

    <!-- bağlantı noktaları -->
    <g fill="#8995fe">
      <circle cx="712" cy="250" r="4.5" opacity="0.45"/>
      <circle cx="734" cy="250" r="4.5" opacity="0.7"/>
      <circle cx="756" cy="250" r="4.5" opacity="0.95"/>
      <circle cx="838" cy="250" r="4.5" opacity="0.45"/>
      <circle cx="860" cy="250" r="4.5" opacity="0.7"/>
      <circle cx="882" cy="250" r="4.5" opacity="0.95"/>
    </g>

    <!-- 1. düğüm: malzeme (kutu) -->
    <circle cx="660" cy="250" r="46" fill="#ffffff" fill-opacity="0.07" stroke="#8995fe" stroke-opacity="0.55" stroke-width="2"/>
    <g transform="translate(636 226) scale(2)" fill="none" stroke="#b9c2ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
      <path d="m3.3 7 8.7 5 8.7-5"/>
      <path d="M12 22V12"/>
    </g>

    <!-- 2. düğüm: ekipman (anahtar) -->
    <circle cx="786" cy="250" r="46" fill="#ffffff" fill-opacity="0.07" stroke="#8995fe" stroke-opacity="0.55" stroke-width="2"/>
    <g transform="translate(762 226) scale(2)" fill="none" stroke="#b9c2ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z"/>
    </g>

    <!-- 3. düğüm: ürün (paket) — vurgulu -->
    <circle cx="906" cy="250" r="50" fill="url(#chip)"/>
    <g transform="translate(880 224) scale(2.167)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/>
      <path d="M12 22V12"/>
      <polyline points="3.29 7 12 12 20.71 7"/>
      <path d="m7.5 4.27 9 5.15"/>
    </g>

    <!-- düğüm etiketleri -->
    <text x="660" y="326" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#9aa3d8">Materials</text>
    <text x="786" y="326" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#9aa3d8">Equipment</text>
    <text x="906" y="326" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#e4e7ff">Products</text>
  </g>
</svg>
